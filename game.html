
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Rush - Game Lobby</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-lobby">

    <div class="lobby-circle circle-one"></div>
    <div class="lobby-circle circle-two"></div>
    <div class="lobby-circle circle-three"></div>
    <div class="lobby-circle circle-four"></div>

    <button class="lobby-back" id="backBtn">&#8592; BACK</button>

    <main class="lobby-container">

        <header class="lobby-logo">
            <h1><span>CODE</span> RUSH</h1>
            <p>RACE YOUR LOGIC</p>
        </header>

        <section class="lobby-player-box">
            <h2>CHOOSE NUMBER OF PLAYERS</h2>

            <div class="lobby-player-options">

                <button class="lobby-player selected" data-players="2">
                    <span class="lobby-person">♟</span>
                    <span>2</span>
                </button>

                <button class="lobby-player" data-players="3">
                    <span class="lobby-person">♟</span>
                    <span>3</span>
                </button>

                <button class="lobby-player" data-players="4">
                    <span class="lobby-person">♟</span>
                    <span>4</span>
                </button>

            </div>
        </section>

        <section class="lobby-room-options">

            <div class="lobby-room-card create-room">
                <div class="lobby-room-icon">＋</div>

                <div class="lobby-room-info">
                    <h2>CREATE ROOM</h2>
                    <p>Start a new room and invite<br>your friends to play.</p>
                </div>

                <button class="lobby-room-btn create-room-btn" id="createBtn">
                    CREATE ROOM <span>→</span>
                </button>
            </div>

            <div class="lobby-room-card join-room">
                <div class="lobby-room-icon join-icon">∞</div>

                <div class="lobby-room-info">
                    <h2>JOIN ROOM</h2>
                    <p>Enter a room code and<br>join the game.</p>
                </div>

                <button class="lobby-room-btn join-room-btn" id="joinBtn">
                    JOIN ROOM <span>→</span>
                </button>
            </div>

        </section>

        <p class="lobby-footer">
            THINK FAST <span>/</span> CODE SMART <span>/</span> RACE TO WIN
        </p>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
