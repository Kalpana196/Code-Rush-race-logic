
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race | Code Rush</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="game-page">

    <nav class="navbar">
        <div class="logo">CODE <span>RUSH</span></div>
        <a href="challenge-selection.html" class="nav-home">EXIT GAME</a>
    </nav>

    <section class="game-section">

        <div class="game-header">
            <div class="game-stat">
                <span>LEVEL</span>
                <h2 id="game-level">01 / 05</h2>
            </div>

            <div class="game-stat">
                <span>SCORE</span>
                <h2 id="game-score">000</h2>
            </div>

            <div class="game-stat">
                <span>TIME</span>
                <h2 id="game-timer">00:30</h2>
            </div>

            <div class="game-stat">
                <span>QUESTION</span>
                <h2 id="question-count">01 / 05</h2>
            </div>
        </div>

       
<div class="race-container">

    <div class="race-heading">
        <h2>RACE <span>TRACK</span></h2>
        <p id="current-track-name">SELECTED TRACK</p>
    </div>

    <div class="race-track" id="race-track">

        <div class="race-finish">FINISH</div>

        <div class="race-road-line"></div>

        <img src="" id="game-car" class="game-car" alt="Selected Car">

    </div>

    <div class="race-progress">
        <div class="progress-info">
            <span>RACE PROGRESS</span>
            <span id="progress-text">0%</span>
        </div>

        <div class="progress-bar">
            <div id="race-progress-fill"></div>
        </div>
    </div>

</div>


        <div class="question-container">

            <div class="question-header">
                <span id="question-category">ARRAY CHALLENGE</span>
                <span id="question-points">+10 POINTS</span>
            </div>

            <h2 id="question-text">Your question will appear here.</h2>

            <div id="answer-options" class="answer-options">
                <button class="answer-option" data-answer="0">Option A</button>
                <button class="answer-option" data-answer="1">Option B</button>
                <button class="answer-option" data-answer="2">Option C</button>
                <button class="answer-option" data-answer="3">Option D</button>
            </div>

            <div id="hint-container" class="hint-container">
                <p id="hint-text"></p>
            </div>

            <div class="question-actions">
                <button id="hint-btn">💡 GET HINT</button>
                <button id="next-question-btn" disabled>NEXT QUESTION →</button>
            </div>

            <p id="answer-feedback"></p>

        </div>

    </section>

</body>
</html>
