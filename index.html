
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Rush: Race Your Logic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="landing">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>

        <section class="content">
            <p class="label">THE ULTIMATE CODING RACE</p>

            <h1>CODE<br><span>RUSH</span></h1>

            <h2>RACE YOUR LOGIC</h2>

            <p class="description">
                Think fast. Code smart. Race to win.
            </p>

            <button id="startBtn">
                START GAME <span>→</span>
            </button>

            <p class="tagline">YOUR LOGIC. YOUR SPEED. YOUR VICTORY.</p>
        </section>

        <section class="visual">
            <div class="glow glow1"></div>
            <div class="glow glow2"></div>

            <div class="code-icon">&lt;/&gt;</div>

            <div class="symbol symbol1">✦</div>
            <div class="symbol symbol2">＋</div>
            <div class="symbol symbol3">◇</div>

            <div class="road">
                <div class="road-line"></div>
                <div class="car car1">🏎️</div>
                <div class="car car2">🏎️</div>
                <div class="finish">FINISH</div>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
